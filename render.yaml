services:
  - type: web
    name: agrismart-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENVIRONMENT
        value: production
      # Groq LLM — set this secret in your Render dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # CORS — allow Vercel and all frontend origins
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        fromDatabase:
          name: agrismart-db
          property: connectionString

databases:
  - name: agrismart-db
    databaseName: agrismart
    user: agrismart_user
    plan: free
