services:
  - type: web
    name: agrismart-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_MODEL
        value: gemini-1.5-pro
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: agrismart-db
          property: connectionString

databases:
  - name: agrismart-db
    databaseName: agrismart
    user: agrismart_user
    plan: free
